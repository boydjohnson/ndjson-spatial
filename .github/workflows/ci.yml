on:
  push:
    branches: [main]
  pull_request:

name: CI

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install gdal and geos
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install gdal and geos
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev
      - name: Build
        run: cargo build --workspace
      - name: Run tests
        run: cargo test --workspace
