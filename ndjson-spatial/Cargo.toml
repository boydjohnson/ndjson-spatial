[package]
name = "ndjson-spatial"
version = "0.1.0"
authors = ["Boyd Johnson <johnson.boyd@gmail.com>"]
edition = "2018"

[[bin]]
path = "src/ndjson_spatial_main.rs"
name = "ndjson-spatial"

[dependencies]
clap = "4.6"
gdal = "0.19"
geo = "0.33"
geos = { version = "11.3", features = ["geo", "v3_8_0"] }
geo-types = "0.7"
geojson = { version = "1.0", features = ["geo-types"] }
h3o = "0.11"
ndjson = { path = "../ndjson" }
ndjson-common = { path = "../ndjson-common", features = ["spatial"] }
rmath-ast = { path = "../rmath-ast" }
rstar = "0.13"
serde_json = "^1.0"
